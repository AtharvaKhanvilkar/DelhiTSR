<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Verify Code - AutoTSR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .spinner-logo {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #e4e4e7;
      border-radius: 50%;
      border-top-color: #09090b;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 flex items-center justify-center min-h-screen p-4 select-none">
  <div class="w-full max-w-[420px] bg-white border border-zinc-200/80 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-10 flex flex-col items-center">
    
    <!-- Spinner Logo -->
    <div class="mb-6 flex justify-center">
      <div class="spinner-logo"></div>
    </div>

    <!-- Title and Subtitle -->
    <h1 class="text-3xl font-bold tracking-tight text-zinc-900 text-center mb-1">Check your email</h1>
    <p class="text-sm text-zinc-500 text-center mb-8 max-w-[300px] leading-relaxed">
      We sent a 6-digit verification code to <span class="font-semibold text-zinc-800 break-all">{{ email }}</span>.
    </p>

    <!-- Error/Flash Messaging -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="w-full mb-6 p-4 text-xs font-semibold text-red-700 bg-red-50 border border-red-200/60 rounded-xl text-center leading-normal">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Form -->
    <form action="/verify/{{ email }}/{{ purpose }}" method="POST" class="w-full space-y-4">
      <div>
        <input type="text" id="otp_code" name="otp_code" required maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code"
               class="w-full px-4 py-3 border border-zinc-250 rounded-xl focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900 outline-none transition-all text-center tracking-[0.75em] text-lg font-bold placeholder-zinc-350"
               placeholder="••••••">
      </div>

      <button type="submit"
              class="w-full bg-[#18181b] hover:bg-black text-white font-semibold py-3 px-4 rounded-xl transition-all text-sm shadow-sm active:scale-[0.98]">
        Verify code & continue
      </button>
    </form>

    <!-- Navigation footer -->
    <div class="w-full flex items-center justify-center mt-6">
      <a href="/login" class="text-xs text-zinc-500 hover:text-zinc-900 font-semibold transition-all">
        Back to sign in
      </a>
    </div>

  </div>
</body>
</html>
